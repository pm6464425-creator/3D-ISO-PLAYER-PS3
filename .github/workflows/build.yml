name: Compilar FLOWPS3 V32

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Instalar dependencias del host
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip git ca-certificates libelf1 zlib1g libgmp10 libstdc++6 python3-pil fonts-dejavu-core

      - name: Descargar PS3DEV precompilado actual
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/ps3dev/ps3dev/releases | jq -r '
            map(select(.prerelease and (.draft | not)))
            | sort_by(.published_at) | reverse | .[0].assets[]
            | select(.name == "ps3dev-linux-X64.tar.gz")
            | .browser_download_url' | head -n1)
          test -n "$URL"
          curl -fL "$URL" -o /tmp/ps3dev.tar.gz
          tar xzf /tmp/ps3dev.tar.gz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Preparar bibliotecas NTFS Cobra UDF e imagenes
        run: |
          mkdir -p third_party/include third_party/lib pkgfiles/USRDIR
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/include/ntfs.h -o third_party/include/ntfs.h
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/include/cobra.h -o third_party/include/cobra.h
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/lib/libcobra.a -o third_party/lib/libcobra.a
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/lib/libfatfs.a -o third_party/lib/libfatfs.a
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/lib/libntfs_ext.a -o third_party/lib/libntfs_ext.a
          curl -fL https://raw.githubusercontent.com/ace20022/libudfread/master/src/udfread.h -o third_party/include/udfread.h
          curl -fL https://raw.githubusercontent.com/ace20022/libudfread/master/src/blockinput.h -o third_party/include/blockinput.h
          curl -fL https://raw.githubusercontent.com/ace20022/libudfread/master/src/default_blockinput.h -o third_party/include/default_blockinput.h
          curl -fL https://raw.githubusercontent.com/ace20022/libudfread/master/src/ecma167.h -o third_party/include/ecma167.h
          curl -fL https://raw.githubusercontent.com/ace20022/libudfread/master/src/udfread.c -o source/udfread.c
          curl -fL https://raw.githubusercontent.com/ace20022/libudfread/master/src/ecma167.c -o source/ecma167.c
          curl -fL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o third_party/include/stb_image.h

      - name: Aplicar parches FLOWPS3
        run: |
          python3 scripts/v12_patch.py
          python3 scripts/v13_patch.py
          python3 scripts/v14_patch.py
          python3 scripts/v15_patch.py
          python3 scripts/v16_patch.py
          python3 scripts/v17_patch.py
          python3 scripts/v18_patch.py
          python3 scripts/v19_patch.py
          python3 scripts/v20_patch.py
          python3 scripts/v21_patch.py
          python3 scripts/v22_patch.py
          python3 scripts/v23_patch.py
          python3 scripts/v24_patch.py
          python3 scripts/v25_patch.py
          python3 scripts/v26_patch.py
          python3 scripts/v27_patch.py
          python3 scripts/v28_patch.py
          python3 scripts/v29_patch.py
          python3 scripts/v30_patch.py
          python3 scripts/v31_patch.py
          python3 scripts/v32_patch.py

      - name: Compilar SNES9x 2010 personalizado para FLOWPS3
        run: |
          rm -rf /tmp/flow-ra /tmp/flow-snes
          git clone --depth 1 https://github.com/libretro/snes9x2010.git /tmp/flow-snes
          make -C /tmp/flow-snes -f Makefile.libretro platform=psl1ght -j2
          test -f /tmp/flow-snes/snes9x2010_libretro_psl1ght.a

          git clone --depth 1 --branch v1.19.1 https://github.com/libretro/RetroArch.git /tmp/flow-ra
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/flow-ra/frontend/drivers/platform_ps3.c')
          s=p.read_text()
          old='#define EMULATOR_CONTENT_DIR "SSNE10001"'
          if old not in s:
              raise SystemExit('EMULATOR_CONTENT_DIR PSL1GHT no encontrado')
          s=s.replace(old, '#define EMULATOR_CONTENT_DIR "3DISO0001"', 1)
          old_shutdown='''static void frontend_ps3_shutdown(bool unused)\n{\n   sysProcessExit(0);\n}\n'''
          new_shutdown='''static void frontend_ps3_shutdown(bool unused)\n{\n   const char *flow_argv[] = { NULL };\n   (void)unused;\n   sysProcessExitSpawn2("/dev_hdd0/game/3DISO0001/USRDIR/FLOWPS3.SELF",\n         flow_argv, NULL, NULL, 0, 1000, SYS_PROCESS_SPAWN_STACK_SIZE_1M);\n   sysProcessExit(0);\n}\n'''
          if old_shutdown not in s:
              raise SystemExit('frontend_ps3_shutdown no encontrado')
          s=s.replace(old_shutdown,new_shutdown,1)
          p.write_text(s)
          PY

          cp /tmp/flow-snes/snes9x2010_libretro_psl1ght.a /tmp/flow-ra/libretro_psl1ght.a
          make -C /tmp/flow-ra -f Makefile.psl1ght -j2
          test -f /tmp/flow-ra/retroarch_psl1ght.self
          mkdir -p pkgfiles/USRDIR/cores pkgfiles/USRDIR/licenses
          cp /tmp/flow-ra/retroarch_psl1ght.self pkgfiles/USRDIR/cores/snes9x2010_libretro_ps3.SELF
          curl -fL https://raw.githubusercontent.com/libretro/snes9x2010/master/LICENSE.txt -o pkgfiles/USRDIR/licenses/SNES9X2010-LICENSE.txt
          ls -lh pkgfiles/USRDIR/cores/snes9x2010_libretro_ps3.SELF

      - name: Preparar raw_iso.sprx
        run: |
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/rawseciso/bin2c/rawseciso.c -o /tmp/rawseciso.c
          python3 -c "import re,pathlib; s=pathlib.Path('/tmp/rawseciso.c').read_text(); m=re.search(r'raw_iso_sprx\\[[^\\]]+\\]\\s*=\\s*\\{(.*?)\\};',s,re.S); assert m; pathlib.Path('pkgfiles/USRDIR/raw_iso.sprx').write_bytes(bytes(int(x,16) for x in re.findall(r'0x([0-9A-Fa-f]{2})',m.group(1))))"

      - name: Crear arte FLOWPS3 V32
        run: python3 scripts/v17_art.py

      - name: Compilar PKG
        run: |
          ppu-gcc --version
          make clean
          make
          test -f 3disoplayer.self
          cp 3disoplayer.self pkgfiles/USRDIR/FLOWPS3.SELF
          make pkg
          ls -lh *.pkg pkgfiles/USRDIR/FLOWPS3.SELF pkgfiles/USRDIR/cores/snes9x2010_libretro_ps3.SELF

      - name: Guardar PKG FLOWPS3 V32
        uses: actions/upload-artifact@v4
        with:
          name: FLOWPS3-V32-PKG
          path: |
            flowps3.pkg
            flowps3.gnpdrm.pkg
            3disoplayer.pkg
            3disoplayer.gnpdrm.pkg
          if-no-files-found: error
