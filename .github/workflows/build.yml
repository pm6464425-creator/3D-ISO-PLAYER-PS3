name: Compilar PKG PS3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Instalar dependencias del host
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq ca-certificates libelf1 zlib1g libgmp10 libstdc++6 python3-pil fonts-dejavu-core

      - name: Descargar PS3DEV precompilado actual
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/ps3dev/ps3dev/releases | jq -r '
            map(select(.prerelease and (.draft | not)))
            | sort_by(.published_at) | reverse | .[0].assets[]
            | select(.name == "ps3dev-linux-X64.tar.gz")
            | .browser_download_url' | head -n1)
          test -n "$URL"
          curl -fL "$URL" -o /tmp/ps3dev.tar.gz
          tar xzf /tmp/ps3dev.tar.gz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Preparar bibliotecas NTFS y Cobra
        run: |
          mkdir -p third_party/include third_party/lib pkgfiles/USRDIR
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/include/ntfs.h -o third_party/include/ntfs.h
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/include/cobra.h -o third_party/include/cobra.h
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/lib/libcobra.a -o third_party/lib/libcobra.a
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/lib/libfatfs.a -o third_party/lib/libfatfs.a
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/lib/libntfs_ext.a -o third_party/lib/libntfs_ext.a

      - name: Preparar raw_iso.sprx
        run: |
          curl -fL https://raw.githubusercontent.com/aldostools/IRISMAN/master/rawseciso/bin2c/rawseciso.c -o /tmp/rawseciso.c
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/rawseciso.c').read_text()
          m=re.search(r'raw_iso_sprx\[[^\]]+\]\s*=\s*\{(.*?)\};', s, re.S)
          if not m:
              raise SystemExit('No se encontró raw_iso_sprx')
          data=bytes(int(x,16) for x in re.findall(r'0x([0-9A-Fa-f]{2})', m.group(1)))
          Path('pkgfiles/USRDIR/raw_iso.sprx').write_bytes(data)
          print('raw_iso.sprx:', len(data), 'bytes')
          PY

      - name: Crear tipografia y arte Cinema para XMB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import os

          Path('pkgfiles/USRDIR').mkdir(parents=True, exist_ok=True)

          # Atlas rasterizado: no se distribuye el archivo de fuente, solo pixeles alfa.
          FW,FH=16,24
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'
          fnt=ImageFont.truetype(font_path,18)
          out=bytearray()
          for code in range(32,127):
              im=Image.new('L',(FW,FH),0)
              d=ImageDraw.Draw(im)
              ch=chr(code)
              box=d.textbbox((0,0),ch,font=fnt)
              tw=box[2]-box[0]; th=box[3]-box[1]
              x=max(0,(FW-tw)//2-box[0])
              y=max(0,(FH-th)//2-box[1]-1)
              d.text((x,y),ch,font=fnt,fill=255)
              out.extend(im.tobytes())
          Path('pkgfiles/USRDIR/FONT.RAW').write_bytes(out)
          print('FONT.RAW:',len(out),'bytes')

          def gradient(size, c1, c2):
              w,h=size
              im=Image.new('RGB',size,c1)
              px=im.load()
              for y in range(h):
                  t=y/max(1,h-1)
                  c=tuple(int(c1[i]*(1-t)+c2[i]*t) for i in range(3))
                  for x in range(w): px[x,y]=c
              return im

          def add_cinema_art(im, title_scale=1.0):
              w,h=im.size
              d=ImageDraw.Draw(im,'RGBA')
              # haz de proyector / luces abstractas
              d.polygon([(int(w*.08),h),(int(w*.47),0),(int(w*.62),0),(int(w*.36),h)],fill=(20,170,225,22))
              d.polygon([(int(w*.92),h),(int(w*.58),0),(int(w*.70),0),(int(w*.99),h)],fill=(116,55,205,20))
              # tira de pelicula
              strip_h=max(24,int(h*.105))
              y=int(h*.76)
              d.rounded_rectangle((0,y,w,y+strip_h),radius=max(5,strip_h//8),fill=(4,10,20,205),outline=(60,180,225,100),width=max(1,w//500))
              hole_w=max(8,int(w*.022)); hole_h=max(6,int(strip_h*.25))
              step=max(20,int(w*.06))
              for x in range(14,w,step):
                  d.rounded_rectangle((x,y+7,x+hole_w,y+7+hole_h),radius=2,fill=(34,76,104,210))
                  d.rounded_rectangle((x,y+strip_h-hole_h-7,x+hole_w,y+strip_h-7),radius=2,fill=(34,76,104,210))
              # reel estilizado
              r=int(min(w,h)*.14); cx=int(w*.17); cy=int(h*.40)
              d.ellipse((cx-r,cy-r,cx+r,cy+r),fill=(6,16,27,235),outline=(102,221,255,230),width=max(2,r//12))
              for ang in (0,90,180,270):
                  import math
                  a=math.radians(ang)
                  hx=int(cx+math.cos(a)*r*.48); hy=int(cy+math.sin(a)*r*.48); rr=max(3,r//5)
                  d.ellipse((hx-rr,hy-rr,hx+rr,hy+rr),fill=(30,70,92,245))
              d.ellipse((cx-r//7,cy-r//7,cx+r//7,cy+r//7),fill=(90,210,245,255))

          # ICON0 320x176
          icon=gradient((320,176),(4,10,20),(18,42,68))
          add_cinema_art(icon)
          d=ImageDraw.Draw(icon,'RGBA')
          ft=ImageFont.truetype(font_path,31)
          fs=ImageFont.truetype(font_path,13)
          d.text((93,48),'3D ISO',font=ft,fill=(245,251,255,255))
          d.text((93,84),'PLAYER',font=ft,fill=(83,216,255,255))
          d.text((95,125),'CINEMA LIBRARY',font=fs,fill=(178,205,224,255))
          icon.save('pkgfiles/ICON0.PNG',optimize=True)

          # PIC1 1920x1080, fondo XMB cinematografico
          pic=gradient((1920,1080),(3,8,17),(14,31,52))
          add_cinema_art(pic)
          d=ImageDraw.Draw(pic,'RGBA')
          ft=ImageFont.truetype(font_path,112)
          fs=ImageFont.truetype(font_path,35)
          d.text((565,350),'3D ISO PLAYER',font=ft,fill=(244,250,255,245))
          d.text((575,485),'CINEMA LIBRARY  •  COBRA  •  NTFS',font=fs,fill=(91,213,255,235))
          d.rounded_rectangle((565,555,1370,562),radius=3,fill=(80,208,250,130))
          pic.save('pkgfiles/PIC1.PNG',optimize=True)
          PY
          ls -lh pkgfiles/ICON0.PNG pkgfiles/PIC1.PNG pkgfiles/USRDIR/FONT.RAW

      - name: Compilar PKG
        run: |
          ppu-gcc --version
          make clean
          make pkg
          ls -lh *.pkg

      - name: Guardar PKG
        uses: actions/upload-artifact@v4
        with:
          name: 3D-ISO-PLAYER-PS3-PKG
          path: |
            3disoplayer.pkg
            3disoplayer.gnpdrm.pkg
          if-no-files-found: error
