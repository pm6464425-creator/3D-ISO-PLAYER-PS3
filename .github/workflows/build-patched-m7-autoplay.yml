name: Build PS3 M7 with startup URI support
on:
  push:
    branches: [movie-v2-26-livebg]
    paths:
      - 'scripts/patch_embedded_m7_cli_v226.py'
      - '.github/workflows/build-patched-m7-autoplay.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Movian M7 and PS3 homebrew toolchain
        run: |
          set -euxo pipefail
          curl --retry 4 -fL 'https://movian.eu/Playstation%203/movianM7-7.0.273-playstation3.pkg' -o /tmp/m7.pkg
          echo '29c06c623b2846d1e9b5717df08397b9c077a90d242d33086bdff557d638e93f  /tmp/m7.pkg' | sha256sum -c -
          python3 scripts/extract_ps3_debug_pkg.py /tmp/m7.pkg --out /tmp/m7_source --prefix USRDIR/movian.self
          echo '25d12712ec5241f6a4aa4d2c8f79638e566989aeb2cc4d95384d53bd908dd8cb  /tmp/m7_source/USRDIR/movian.self' | sha256sum -c -
          curl --retry 4 -fL 'https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz' -o /tmp/ps3dev.tar.gz
          tar xzf /tmp/ps3dev.tar.gz -C "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE/ps3dev" -name make_self -o -name make_fself | head -30
          python3 -m pip install -q cryptography
      - name: Decrypt, insert URL-arg trampoline and re-sign Movian standalone SELF
        run: |
          set -euxo pipefail
          git clone -q --depth=1 https://github.com/zecoxao/ida_console_py_ps3.git /tmp/ps3self
          python3 /tmp/ps3self/loaders/ps3lib/sce.py /tmp/m7_source/USRDIR/movian.self /tmp/m7.elf
          python3 scripts/patch_embedded_m7_cli_v226.py /tmp/m7_source/USRDIR/movian.self /tmp/m7.elf /tmp/m7_modified.elf
          SELF_TOOL="$(find "$GITHUB_WORKSPACE/ps3dev" -type f -name make_self -perm /111 | head -1)"
          test -n "$SELF_TOOL"
          "$SELF_TOOL" /tmp/m7_modified.elf /tmp/m7_signed_nozip.self
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,struct
          base=Path('/tmp/m7_source/USRDIR/movian.self').read_bytes()
          signed=Path('/tmp/m7_signed_nozip.self').read_bytes()
          assert signed[:4]==bytes.fromhex('53434500')
          zoff=base.find(bytes.fromhex('504b0304'))
          assert zoff>5000000
          # M7 ziptail stores the skin, GUI files and symbolic names;
          # it must survive unchanged after the signed program image.
          patched=signed+base[zoff:]
          out=Path('/tmp/flow_m7_patched_autoplay.self')
          out.write_bytes(patched)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert len(z.namelist())==383
              assert 'movian.syms' in z.namelist()
          print('SIGNED_SELF',len(signed),'WITH_ZIP',len(patched),
                hashlib.sha256(patched).hexdigest())
          print('PS3 self header',signed[:64].hex())
          PY
          python3 /tmp/ps3self/loaders/ps3lib/sce.py /tmp/flow_m7_patched_autoplay.self /tmp/m7_roundtrip.elf
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          x=Path('/tmp/m7_modified.elf').read_bytes()
          y=Path('/tmp/m7_roundtrip.elf').read_bytes()
          assert len(x)==len(y)
          # ELF rebuilding may change non-alloc tail, but all patched code and
          # the modified LOAD program header must round-trip unaltered.
          for p in [0x1db738,0xbe0750,0xbe0754,0xbe0758,0xbe075c,
                    0xbe0760,0xbe0764,0xbe0768,0xbe076c,0xbe0770]:
              assert x[p]==y[p],hex(p)
          print('Round trip from signed fSELF verified',len(y))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M7-7.0.273-Patched-Autostart-SELF
          path: |
            /tmp/flow_m7_patched_autoplay.self
          if-no-files-found: error
