name: Compilar FLOW MOVIE V2.26 LIVE BG

on:
  push:
    branches: [ movie-v2-26-livebg ]
    paths:
      - 'scripts/build_v226_internal_ci.sh'
      - 'scripts/mkv_v226_internal_player.py'
      - 'scripts/hq_asset_jpg_v226.py'
      - 'scripts/live_motion_boost_v226.py'
      - 'scripts/particle_size_xl_v226.py'
      - 'scripts/particle_xl_safe_render_v226.py'
      - 'scripts/particle_bigger_smoother_final_v226.py'
      - 'scripts/coverflow_smooth60_v226.py'
      - 'scripts/coverflow_reference_motion_v226.py'
      - 'scripts/cover_cache_idle_v226.py'
      - 'scripts/runtime_microstutter_v226.py'
      - 'scripts/large_library_v226.py'
      - 'scripts/gpu_cover_v226.py'
      - 'scripts/gpu_cover_motion_nofence_v226.py'
      - 'scripts/realtime_motion_perf_v226.py'
      - 'scripts/persistent_case_motion_v226.py'
      - 'scripts/system_menu_pause_v226.py'
      - 'scripts/system_menu_keepflip_v226.py'
      - 'scripts/psmenu_static_front_v226.py'
      - 'scripts/transition_brightness_v226.py'
      - 'scripts/mkv_verified_showtime_v226.py'
      - 'scripts/mkv_safe_cobra_handoff_v226.py'
      - '.github/workflows/build-v226-internal-eboot.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Preparar biblioteca grande antes de V2.26
        run: python3 scripts/large_library_v226.py

      - name: Construir y verificar V2.26 LIVE BG
        run: bash scripts/build_v226_internal_ci.sh

      - name: Fondo HQ, coverflow GPU, tiempo real, marco persistente y menu PS fluido
        run: |
          export PS3DEV="$GITHUB_WORKSPACE/ps3dev"
          export PSL1GHT="$GITHUB_WORKSPACE/ps3dev"
          export PATH="$GITHUB_WORKSPACE/ps3dev/bin:$GITHUB_WORKSPACE/ps3dev/ppu/bin:$GITHUB_WORKSPACE/ps3dev/spu/bin:$PATH"
          python3 scripts/hq_asset_jpg_v226.py
          python3 scripts/live_motion_boost_v226.py
          python3 scripts/particle_size_xl_v226.py
          python3 scripts/particle_xl_safe_render_v226.py
          python3 scripts/particle_bigger_smoother_final_v226.py
          python3 scripts/coverflow_smooth60_v226.py
          python3 scripts/coverflow_reference_motion_v226.py
          python3 scripts/cover_cache_idle_v226.py
          python3 scripts/runtime_microstutter_v226.py
          python3 scripts/large_library_v226.py
          python3 scripts/gpu_cover_v226.py
          python3 scripts/gpu_cover_motion_nofence_v226.py
          python3 scripts/realtime_motion_perf_v226.py
          python3 scripts/persistent_case_motion_v226.py
          python3 scripts/system_menu_pause_v226.py
          python3 scripts/system_menu_keepflip_v226.py
          python3 scripts/psmenu_static_front_v226.py
          python3 scripts/transition_brightness_v226.py
          python3 scripts/mkv_verified_showtime_v226.py
          python3 scripts/mkv_safe_cobra_handoff_v226.py
          # Replace the old NPDRM EBOOT rename with a real bootable Showtime SELF.
          curl --retry 4 --retry-delay 2 -fL 'https://github.com/aldostools/IRISMAN/releases/download/4.91/IRISMAN_4.91.pkg' -o /tmp/irisman_mkv_source.pkg
          python3 scripts/extract_ps3_debug_pkg.py /tmp/irisman_mkv_source.pkg --out /tmp/verified_showtime --prefix USRDIR/SHOWTIME.SELF
          echo 'c6fef7d910e5bf35b499dfc932e6c8f1084401bf1a5ed5e99939c70829169f25  /tmp/verified_showtime/USRDIR/SHOWTIME.SELF' | sha256sum -c -
          cp /tmp/verified_showtime/USRDIR/SHOWTIME.SELF pkgfiles/USRDIR/flow_player.self
          test "$(stat -c%s pkgfiles/USRDIR/flow_player.self)" -eq 11192245
          cp source/main.cpp generated_main_v226.cpp
          cp source/rsxutil.cpp generated_rsxutil_v226.cpp
          make clean
          make
          make pkg
          cp 3disoplayer.pkg FLOW_MOVIE_V2_26_INTERNAL_PLAYER.pkg
          cp 3disoplayer.gnpdrm.pkg FLOW_MOVIE_V2_26_INTERNAL_PLAYER_GNPDRM.pkg
          grep -q 'APPBG_HQ.JPG' generated_main_v226.cpp
          grep -q 'V226_BIGGER_SMOOTHER_FINAL' generated_main_v226.cpp
          grep -q '#define COVER_CACHE_SLOTS 16' generated_main_v226.cpp
          grep -q '#define MAX_LIBRARY_ITEMS 1024' generated_main_v226.cpp
          grep -q 'fresh.reserve(MAX_LIBRARY_ITEMS);' generated_main_v226.cpp
          grep -q 'gpu_ready=rsx_cover_upload(slot,argb,(u32)cw,(u32)ch);' generated_main_v226.cpp
          grep -q 'V2.26 GPU COVER: persistent poster surfaces in RSX local memory.' generated_rsxutil_v226.cpp
          grep -q 'V2.26 MOTION NO-FENCE' generated_main_v226.cpp
          grep -q 'V2.26 REALTIME MOTION PERF' generated_main_v226.cpp
          grep -q 'V2.26 PERSISTENT CASE DURING MOTION' generated_main_v226.cpp
          grep -q 'V2.26 SYSTEM MENU PAUSE' generated_main_v226.cpp
          grep -q 'V2.26 PS HOME MENU LIVE-FLIP' generated_main_v226.cpp
          grep -q 'V2.26 PS MENU STATIC FRONT BUFFER' generated_main_v226.cpp
          grep -q 'V2.26 TRANSITION BRIGHTNESS FIX' generated_main_v226.cpp
          grep -q 'V2.26 VERIFIED SHOWTIME MKV' generated_main_v226.cpp
          grep -q 'V2.26 MKV SAFE HANDOFF' generated_main_v226.cpp
          grep -q 'MKV_SAFE_AUTOPLAY_READY' generated_main_v226.cpp
          grep -q 'mkv_cobra_map_path(mm_path,flow_path)' generated_main_v226.cpp
          grep -q 'lv2syscall2(35,' generated_main_v226.cpp
          ! grep -q 'getcwd(' generated_main_v226.cpp
          ! grep -q 'chdir(' generated_main_v226.cpp
          grep -q 'showtime_autoplay_file(player,url)' generated_main_v226.cpp
          grep -q 'sysProcessExitSpawn2(player,NULL,NULL,NULL,0,1200,' generated_main_v226.cpp
          ! grep -q 'launchargv\[0\]=player;' generated_main_v226.cpp
          grep -q 'if(++idle_tick < 4u) return;' generated_main_v226.cpp
          ! grep -q 'fill_rect(x+shad,y+shad,w,h,0x44000000);' generated_main_v226.cpp
          grep -q 'rsx_flip_last_complete();' generated_main_v226.cpp
          grep -q 'gcmSetFlip(context,curr_fb \^ 1u);' generated_rsxutil_v226.cpp
          grep -q 'if(!app_running) break;' generated_main_v226.cpp
          ! grep -q 'usleep(8000);' generated_main_v226.cpp
          grep -q 'case SYSUTIL_MENU_OPEN:' generated_main_v226.cpp
          grep -q 'case SYSUTIL_MENU_CLOSE:' generated_main_v226.cpp
          grep -q 'if(g_system_menu_open)' generated_main_v226.cpp
          grep -q 'gettimeofday(&tv,NULL);' generated_main_v226.cpp
          grep -q 'while(remaining>0.00001f && substeps<4)' generated_main_v226.cpp
          grep -q 'if(g_flow_frame_dt>0.024f) g_cover_lod_hold=12;' generated_main_v226.cpp
          grep -q 'const bool cover_lod=(g_cover_lod_hold>0);' generated_main_v226.cpp
          grep -q 'draw_rgba_region_scaled(x,y,w,top_dst,&g_case_frame,0,0,fw,top_src);' generated_main_v226.cpp
          ! sed -n '/static void flow_update()/,/static void cover_cache_clear/p' generated_main_v226.cpp | grep -q 'const float dt=1.0f/60.0f;'
          test -s pkgfiles/USRDIR/APPBG_HQ.JPG

      - name: Guardar V2.26 MKV RECOVERY
        uses: actions/upload-artifact@v4
        with:
          name: FLOW-MOVIE-V2-26-MKV-RECOVERY
          path: |
            FLOW_MOVIE_V2_26_INTERNAL_PLAYER.pkg
            FLOW_MOVIE_V2_26_INTERNAL_PLAYER_GNPDRM.pkg
            internal_player.sha256
            generated_main_v226.cpp
            generated_rsxutil_v226.cpp
          if-no-files-found: error
