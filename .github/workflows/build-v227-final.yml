name: Compilar FLOW MOVIE V2.27 FINAL PKG

on:
  push:
    branches: [ movie-v2-27 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener FLOW MOVIE
        uses: actions/checkout@v4

      - name: Instalar dependencias host
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git ca-certificates build-essential pkg-config autoconf automake libtool cmake ninja-build yasm nasm bison flex xz-utils unzip patch perl libelf1 zlib1g libgmp10 libstdc++6 python3 python3-pil fonts-dejavu-core

      - name: Compilar V2.27 FINAL
        run: bash scripts/build_v227_final.sh

      - name: Guardar V2.27 FINAL
        uses: actions/upload-artifact@v4
        with:
          name: FLOW-MOVIE-V2-27-INTERNAL-SELF-LOG-FINAL
          path: |
            FLOW_MOVIE_V2_27_INTERNAL_SELF_LOG.pkg
            FLOW_MOVIE_V2_27_INTERNAL_SELF_LOG_GNPDRM.pkg
            internal_player_v227.sha256
            v227_final.sha256
            generated_main_v227.cpp
            generated_rsxutil_v227.cpp
          if-no-files-found: error
